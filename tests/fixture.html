<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KuRent — isolated browser test fixture</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Deterministic, accelerated test page. Never imported by the production app.
      Math.random = () =>
        new URLSearchParams(location.search).get("method") === "click"
          ? 0.25
          : 0.9;
      const testStorage = new Map();
      Object.defineProperty(window, "localStorage", {
        value: {
          getItem: (key) => testStorage.get(key) ?? null,
          setItem: (key, value) => testStorage.set(key, value),
        },
      });
      const nativeAnimationFrame = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = (callback) =>
        nativeAnimationFrame((now) => callback(now * 12));
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
